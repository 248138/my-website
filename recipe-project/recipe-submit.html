<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Submit</title>
</head>
<body>
    <header>
        <p>Recipe Website</p>
        <nav>
            <a href="recipe-home.html">Recipe Home</a>
        </nav>
    </header>
    <main>
        <hr />
        <form action="">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Name">
            </div>
            <div>
                <label for="userEmail">Email Address:</label>
                <input type="email" id="userEmail" name="userEmail" placeholder="Email">
            </div>
            <div>
                <label for="catagory">Recipe Catagory:</label>
                <select name="catagory" id="catagory">
                    <option value="italian">Italian</option>
                    <option value="Japanese">Japanese</option>
                    <option value="american">American</option>
                    <option value="thai">Thai</option>
                    <option value="chinese">Chinese</option>
                    <option value="british">British</option>
                    <option value="french">French</option>
                </select>
            </div>
            <div>
                <label for="recipe">Recipe</label>
                <textarea name="recipe" id="recipe"></textarea>
            </div>
        </form>
    </main>
</body>
</html>
